<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIIT Attendance System</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <div class="login-container">
            <aside class="brand-panel">
                <img src="./img/niit-logo-white.png" alt="NIIT">
                <div>
                    <h2>Every class, on the record.</h2>
                    <p>Sign in to mark attendance, review sessions and keep timetables current.</p>
                </div>
            </aside>

            <div class="login-card">
                <img class="form-logo" src="./img/niit-logo.png" alt="NIIT">
                <h1>NIIT Attendance System</h1>

                <p class="login-subtitle">Login to your account</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" id="loginButton">
                        Login
                    </button>

                    <button type="button" id="forgotPasswordButton">
                        Forgot Password?
                    </button>

                    <p id="loginMessage"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/common.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
